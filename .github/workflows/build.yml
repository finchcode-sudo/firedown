name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-37.1" || \
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-37"

      # The author's prebuilt FFmpeg release is not downloadable, so build the
      # same libs from the public firedown-ffmpeg source (arm64-v8a only, which is
      # all the app ships). Cached, so only the first run is slow.
      - name: Cache FFmpeg libs
        id: ffcache
        uses: actions/cache@v4
        with:
          path: external/ffmpeg
          key: ffmpeg-${{ hashFiles('gradle.properties') }}-arm64-v1

      - name: Build FFmpeg from source
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson nasm ninja-build
          git clone --depth 1 https://github.com/solarizeddev/firedown-ffmpeg.git ffmpeg-src
          cd ffmpeg-src
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./ffmpeg-android-maker.sh -dav1d -abis=arm64-v8a
          cd ..
          mkdir -p external/ffmpeg/lib
          cp -r ffmpeg-src/output/lib/arm64-v8a external/ffmpeg/lib/
          cp -r ffmpeg-src/output/include/arm64-v8a external/ffmpeg/include
          TAG="$(sed -n 's/^firedown.ffmpegRelease=//p' gradle.properties | head -1)"
          echo "firedown-ffmpeg release $TAG (built in CI)" > external/ffmpeg/version.txt
          ls external/ffmpeg/lib/arm64-v8a

      # settings.gradle downloads the prebuilt FFmpeg libs from the public
      # solarizeddev/firedown-ffmpeg release; GeckoView comes from Mozilla's
      # public maven (stock build, not the author's private patched one).
      - name: Build release APK
        env:
          GITHUB_TOKEN: ${{ secrets.PREBUILTS_TOKEN || github.token }}
        run: |
          chmod +x gradlew scripts/fetch-prebuilts.sh
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      # On failure, print only the useful lines so they are easy to copy.
      - name: Show error summary
        if: failure()
        run: |
          grep -nE "\[prebuilts\]|ERROR|What went wrong|Caused by:|error:|FAILED" -A2 build.log | head -80

      # assembleRelease is unsigned; sign it so it can be installed.
      # Optional secrets for a stable key: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS. Without them a throw-away key is made (updates over an
      # older build will then fail to install).
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            PASS=android; ALIAS=key
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Firedown CI"
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out firedown-release.apk aligned.apk
          "$BT/apksigner" verify firedown-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: firedown-apk
          path: firedown-release.apk
