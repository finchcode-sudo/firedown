name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-37.1" || \
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-37"

      # settings.gradle downloads the prebuilt FFmpeg libs from the public
      # solarizeddev/firedown-ffmpeg release; GeckoView comes from Mozilla's
      # public maven (stock build, not the author's private patched one).
      - name: Build release APK
        env:
          GITHUB_TOKEN: ${{ secrets.PREBUILTS_TOKEN || github.token }}
        run: |
          chmod +x gradlew scripts/fetch-prebuilts.sh
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      # On failure, print only the useful lines so they are easy to copy.
      - name: Show error summary
        if: failure()
        run: |
          grep -nE "\[prebuilts\]|ERROR|What went wrong|Caused by:|error:|FAILED" -A2 build.log | head -80

      # assembleRelease is unsigned; sign it so it can be installed.
      # Optional secrets for a stable key: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS. Without them a throw-away key is made (updates over an
      # older build will then fail to install).
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            PASS=android; ALIAS=key
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Firedown CI"
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out firedown-release.apk aligned.apk
          "$BT/apksigner" verify firedown-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: firedown-apk
          path: firedown-release.apk
